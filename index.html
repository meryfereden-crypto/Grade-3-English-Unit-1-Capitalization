<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Capitalization Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for aesthetic */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <!-- Container -->
    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden fade-in relative" id="app-container">
        
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold">Capitalization Practice</h1>
            <p class="text-indigo-200 mt-2 text-sm md:text-base">Grade 3 English Interactive Quiz</p>
        </header>

        <!-- SCREEN 1: Login / Identification -->
        <div id="screen-login" class="p-6 md:p-10 block">
            <div class="max-w-md mx-auto">
                <h2 class="text-xl font-semibold mb-6 text-center">Student Details</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" for="studentName">Full Name</label>
                        <input type="text" id="studentName" placeholder="Enter your full name" 
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" for="studentId">ID Number</label>
                        <input type="text" id="studentId" placeholder="Enter your ID number" 
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                    </div>
                    <button onclick="startQuiz()" 
                        class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all active:scale-95">
                        Start Quiz
                    </button>
                </div>
            </div>
        </div>

        <!-- SCREEN 2: Quiz -->
        <div id="screen-quiz" class="p-6 md:p-10 hidden flex-col min-h-[500px]">
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full" id="question-tracker">Question 1 / 24</span>
                <button onclick="readQuestion()" class="flex items-center space-x-2 text-indigo-600 hover:text-indigo-800 transition-colors" title="Listen with British Accent">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                    <span class="text-sm font-medium">Listen</span>
                </button>
            </div>

            <!-- Question Area -->
            <div class="mb-8">
                <p class="text-gray-500 text-sm mb-2">Identify the correctly capitalized sentence:</p>
                <h3 id="question-text" class="text-xl md:text-2xl font-semibold text-slate-800"></h3>
            </div>

            <!-- Options Area -->
            <div id="options-container" class="space-y-3 mb-8 flex-grow">
                <!-- Buttons injected via JS -->
            </div>

            <!-- Feedback Area -->
            <div id="feedback-area" class="hidden mb-8 p-4 rounded-lg border fade-in">
                <div class="flex items-start">
                    <div id="feedback-icon" class="mr-3 mt-1"></div>
                    <div>
                        <h4 id="feedback-title" class="font-bold text-lg mb-1"></h4>
                        <div class="space-y-2 text-sm">
                            <p id="feedback-expl-en" class="font-medium text-slate-700"></p>
                            <p id="feedback-expl-am" class="text-slate-600 bg-slate-50 p-2 rounded border border-slate-100"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex justify-between items-center pt-4 border-t border-gray-100 mt-auto">
                <button id="btn-back" onclick="navigate(-1)" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Back
                </button>
                <div class="space-x-3">
                    <button id="btn-skip" onclick="navigate(1, true)" class="px-5 py-2.5 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-colors">
                        Skip
                    </button>
                    <button id="btn-next" onclick="navigate(1)" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 shadow-sm transition-colors hidden">
                        Next Question
                    </button>
                    <button id="btn-submit" onclick="showResults()" class="px-5 py-2.5 rounded-lg bg-green-600 text-white font-medium hover:bg-green-700 shadow-sm transition-colors hidden">
                        Submit Quiz
                    </button>
                </div>
            </div>
        </div>

        <!-- SCREEN 3: Results Dashboard -->
        <div id="screen-results" class="p-6 md:p-10 hidden text-center fade-in">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Completed!</h2>
            <p class="text-slate-600 mb-8">Great job, <span id="res-name" class="font-semibold"></span> (ID: <span id="res-id"></span>).</p>
            
            <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100 inline-block mb-8">
                <p class="text-sm text-indigo-800 font-medium uppercase tracking-wide mb-1">Your Final Score</p>
                <div class="text-5xl font-black text-indigo-600"><span id="res-score"></span><span class="text-2xl text-indigo-400">/24</span></div>
            </div>

            <div class="space-y-4 max-w-sm mx-auto">
                <button onclick="sendResultsEmail()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    Email Results to Teacher
                </button>
                <button onclick="location.reload()" class="w-full bg-white border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-semibold py-3 px-4 rounded-lg transition-all">
                    Retake Quiz
                </button>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->

                correctIndex: 0,
                explEn: "Capitalize the first word ('Oh'), and the pronoun 'I' starting the next sentence.",
                explAm: "የመጀመሪያውን ቃል ('Oh') እና ተውላጠ ስም 'I'ን በካፒታል ይፃፉ።"
            },
            {
                uncapitalized: "23. lensa and her grandmother like to drink coffee together.",
                options: [
                    "Lensa and her Grandmother like to drink coffee together.",
                    "lensa and her grandmother like to drink coffee together.",
                    "Lensa and her grandmother like to drink coffee together."
                ],
                correctIndex: 2,
                explEn: "Capitalize the first word/person's name ('Lensa'). 'Grandmother' is a common noun here.",
                explAm: "የመጀመሪያውን ቃል እና የሰውን ስም ('Lensa') በካፒታል ይፃፉ። እዚህ ላይ 'grandmother' የተባለው ቃል ተራ ስም ነው።"
            },
            {
                uncapitalized: "24. how old is your younger sister ,Kalkidan?",
                options: [
                    "How old is your younger Sister, Kalkidan?",
                    "How old is your younger sister, Kalkidan?",
                    "how old is your younger sister, Kalkidan?"
                ],
                correctIndex: 1,
                explEn: "Capitalize the first word ('How') and the person's name ('Kalkidan').",
                explAm: "የመጀመሪያውን ቃል ('How') እና የሰውን ስም ('Kalkidan') በካፒታል ይፃፉ።"
            },
            {
                uncapitalized: "25. the simien mountains are home to the walia ibex.",
                options: [
                    "The simien mountains are home to the Walia Ibex.",
                    "The Simien Mountains are home to the walia ibex.",
                    "the Simien Mountains are home to the walia ibex."
                ],
                correctIndex: 1,
                explEn: "Capitalize the first word ('The') and specific geographical names ('Simien Mountains').",
                explAm: "የመጀመሪያውን ቃል ('The') እና የተለዩ የጂኦግራፊያዊ ቦታ ስሞችን ('Simien Mountains') በካፒታል ይፃፉ።"
            }
        ];

        // State Variables
        let studentName = "";
        let studentId = "";
        let currentIdx = 0;
        let score = 0;
        let answers = new Array(quizData.length).fill(null); // stores true/false/skipped

        // Elements
        const screens = {
            login: document.getElementById('screen-login'),
            quiz: document.getElementById('screen-quiz'),
            results: document.getElementById('screen-results')
        };
        const elements = {
            nameInput: document.getElementById('studentName'),
            idInput: document.getElementById('studentId'),
            progressBar: document.getElementById('progress-bar'),
            qTracker: document.getElementById('question-tracker'),
            qText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            feedbackArea: document.getElementById('feedback-area'),
            feedbackIcon: document.getElementById('feedback-icon'),
            feedbackTitle: document.getElementById('feedback-title'),
            feedbackExplEn: document.getElementById('feedback-expl-en'),
            feedbackExplAm: document.getElementById('feedback-expl-am'),
            btnBack: document.getElementById('btn-back'),
            btnSkip: document.getElementById('btn-skip'),
            btnNext: document.getElementById('btn-next'),
            btnSubmit: document.getElementById('btn-submit')
        };

        // Initialize Speech Synthesis
        let synth = window.speechSynthesis;
        let ukFemaleVoice = null;
        
        function setVoice() {
            const voices = synth.getVoices();
            // Look for Google UK English Female, or any en-GB female, fallback to en-GB
            ukFemaleVoice = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Female') || v.name.includes('Google UK'))) 
                         || voices.find(v => v.lang === 'en-GB');
        }
        
        // Browsers load voices async
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = setVoice;
        }

        // Functions
        function startQuiz() {
            studentName = elements.nameInput.value.trim();
            studentId = elements.idInput.value.trim();
            
            if(!studentName || !studentId) {
                alert("Please enter both Name and ID to begin."); // Using basic alert for login validation fallback if empty
                return;
            }

            switchScreen('quiz');
            loadQuestion();
        }

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => {
                s.classList.add('hidden');
                s.classList.remove('flex', 'block');
            });
            
            if(screenName === 'quiz') screens.quiz.classList.add('flex');
            else screens[screenName].classList.add('block');
            
            screens[screenName].classList.remove('hidden');
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            
            // UI Updates
            elements.qTracker.innerText = `Question ${currentIdx + 1} / ${quizData.length}`;
            elements.progressBar.style.width = `${((currentIdx) / quizData.length) * 100}%`;
            elements.qText.innerText = q.uncapitalized;
            
            // Buttons logic
            elements.btnBack.disabled = currentIdx === 0;
            elements.feedbackArea.classList.add('hidden');
            
            // Render Options
            elements.optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 font-medium text-slate-700 transition-all duration-200 outline-none focus:ring-4 focus:ring-indigo-100 shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                
                // If previously answered, restore state
                if(answers[currentIdx] !== null && answers[currentIdx] !== 'skipped') {
                    btn.disabled = true;
                    btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50', 'cursor-pointer');
                    
                    if(idx === q.correctIndex) {
                        btn.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
                    } else if (answers[currentIdx] === false && btn.innerText === q.options[idx]) {
                        // We can't strictly track WHICH wrong option they clicked in this simple array format, 
                        // but we reveal the correct one anyway.
                    }
                }
                
                elements.optionsContainer.appendChild(btn);
            });

            updateNavButtons();
            
            // If already answered, show feedback immediately
            if(answers[currentIdx] !== null && answers[currentIdx] !== 'skipped') {
                showFeedback(answers[currentIdx] === true, q);
            }
        }

        function selectOption(selectedIndex, btnElement) {
            const q = quizData[currentIdx];
            const isCorrect = selectedIndex === q.correctIndex;
            
            // Lock answers
            const buttons = elements.optionsContainer.querySelectorAll('button');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50');
                
                if (idx === q.correctIndex) {
                    btn.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
                    btn.innerHTML += ` <span class="float-right text-green-600 font-bold">✓ Correct</span>`;
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('border-red-400', 'bg-red-50', 'text-red-700');
                    btn.innerHTML += ` <span class="float-right text-red-500 font-bold">✗ Incorrect</span>`;
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            // Save Score
            if(answers[currentIdx] === null || answers[currentIdx] === 'skipped') {
                answers[currentIdx] = isCorrect;
                if(isCorrect) score++;
            }

            showFeedback(isCorrect, q);
            updateNavButtons();
        }

        function showFeedback(isCorrect, q) {
            elements.feedbackArea.classList.remove('hidden', 'border-green-200', 'bg-green-50', 'border-red-200', 'bg-red-50');
            
            if(isCorrect) {
                elements.feedbackArea.classList.add('border-green-200', 'bg-green-50');
                elements.feedbackTitle.className = "font-bold text-lg mb-1 text-green-800";
                elements.feedbackTitle.innerText = "Excellent!";
                elements.feedbackIcon.innerHTML = `<svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else {
                elements.feedbackArea.classList.add('border-red-200', 'bg-red-50');
                elements.feedbackTitle.className = "font-bold text-lg mb-1 text-red-800";
                elements.feedbackTitle.innerText = "Incorrect";
                elements.feedbackIcon.innerHTML = `<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            elements.feedbackExplEn.innerText = q.explEn;
            elements.feedbackExplAm.innerText = q.explAm;
            
            // Scroll to feedback
            elements.feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function updateNavButtons() {
            const isAnswered = answers[currentIdx] !== null && answers[currentIdx] !== 'skipped';
            const isLast = currentIdx === quizData.length - 1;

            if (isAnswered) {
                elements.btnSkip.classList.add('hidden');
                if (isLast) {
                    elements.btnNext.classList.add('hidden');
                    elements.btnSubmit.classList.remove('hidden');
                } else {
                    elements.btnNext.classList.remove('hidden');
                    elements.btnSubmit.classList.add('hidden');
                }
            } else {
                elements.btnSkip.classList.remove('hidden');
                elements.btnNext.classList.add('hidden');
                elements.btnSubmit.classList.add('hidden');
                // If on last question and skipping, just allow them to submit right away
                if(isLast) {
                     elements.btnSkip.innerText = "Skip & Submit";
                     elements.btnSkip.onclick = () => { navigate(1, true); showResults(); }
                } else {
                     elements.btnSkip.innerText = "Skip";
                     elements.btnSkip.onclick = () => navigate(1, true);
                }
            }
        }

        function navigate(dir, isSkip = false) {
            if(synth.speaking) synth.cancel(); // Stop reading if moving away

            if(isSkip && answers[currentIdx] === null) {
                answers[currentIdx] = 'skipped';
            }
            
            const newIdx = currentIdx + dir;
            if(newIdx >= 0 && newIdx < quizData.length) {
                currentIdx = newIdx;
                loadQuestion();
            }
        }

        function showResults() {
            if(synth.speaking) synth.cancel();
            
            // Set progress bar to 100%
            elements.progressBar.style.width = "100%";
            
            switchScreen('results');
            document.getElementById('res-name').innerText = studentName;
            document.getElementById('res-id').innerText = studentId;
            document.getElementById('res-score').innerText = score;
        }

        function readQuestion() {
            if (synth.speaking) {
                synth.cancel();
                return;
            }
            const qText = quizData[currentIdx].uncapitalized.replace(/^\d+\.\s*/, ''); // Remove number at start
            const utterance = new SpeechSynthesisUtterance(qText);
            
            if(!ukFemaleVoice) setVoice(); // Try again if not loaded
            if(ukFemaleVoice) utterance.voice = ukFemaleVoice;
            
            utterance.rate = 0.85; // Slightly slower for clarity
            synth.speak(utterance);
        }

        function sendResultsEmail() {
            const subject = encodeURIComponent(`Capitalization Quiz Results: ${studentName} (${studentId})`);
            const body = encodeURIComponent(`Hello Teacher,\n\nHere are my quiz results:\n\nStudent Name: ${studentName}\nID Number: ${studentId}\nFinal Score: ${score} out of 24\n\nThank you.`);
            window.location.href = `mailto:mesayferedegn2@gmail.com?subject=${subject}&body=${body}`;
        }
    </script>
</body>
</html>
